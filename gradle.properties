# 沙箱 /tmp 为 noexec 挂载,原生库提取需可执行目录(kotlin daemon 与 Gradle 进程)
systemProp.java.io.tmpdir=/opt/tmp-exec
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -Djava.io.tmpdir=/opt/tmp-exec
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Room 2.6.1 与 KSP2 不兼容(处理器类加载器找不到 sqlite 原生库),强制 KSP1
ksp.useKSP2=false
